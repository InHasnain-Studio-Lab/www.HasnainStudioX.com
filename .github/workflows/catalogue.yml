name: Catalogue

# Rebuilds hub-catalog.json whenever an app page changes, so installed copies of
# HSX Apps Hub see the change without anything being run by hand.

on:
  push:
    branches: [main]
    paths:
      - 'Windows-apps.html'
      - 'android-apps.html'
      - 'contact.html'
      - 'app-releases.json'
      - 'tools/build-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the catalogue
        run: node tools/build-catalog.js "$GITHUB_WORKSPACE"

      - name: Commit it when it changed
        run: |
          if git diff --quiet -- hub-catalog.json; then
            echo "catalogue unchanged"
            exit 0
          fi

          git config user.name "HSX catalogue"
          git config user.email "actions@users.noreply.github.com"
          git add hub-catalog.json
          git commit -m "Catalogue rebuilt from the site"
          git push

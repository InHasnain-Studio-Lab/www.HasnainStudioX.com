name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # full history: sitemap lastmod is taken from each file's last commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── build ──────────────────────────────────────────────────────────
      # Regenerates the app counts, structured data, the static catalogue that
      # non-JavaScript crawlers read, and sitemap.xml. Runs here so nothing has
      # to be built on a PC before pushing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet "Pillow>=11"

      - name: Refresh gallery list and WebP versions
        run: |
          node update-gallery.js || true
          python optimise-images.py || true

      - name: Build catalogue, structured data and sitemap
        run: node build.js

      # ── deploy ─────────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Build inputs are not part of the published site. Left in place they are
      # served as real URLs - articles-src/prompt-guide.html in particular is a
      # raw fragment whose text is duplicated inside the AI Studio page.
      - name: Strip build sources from the published site
        run: |
          rm -rf articles-src
          rm -f build.js gen-app-pages.js update-gallery.js optimise-images.py \
                make-icons.py README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── tell the search engines ────────────────────────────────────────
      - name: Submit every URL to Bing, Yandex, Seznam and Naver
        run: node submit-indexnow.js

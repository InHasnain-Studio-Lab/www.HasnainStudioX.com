name = "hsx-contact"
main = "contact-worker.js"
compatibility_date = "2026-09-01"

# creates the hostname and its DNS record on deploy, so the name cannot be
# mistyped in the dashboard and no route is needed
routes = [
  { pattern = "api.hasnainstudiox.com", custom_domain = true }
]

[vars]
MAIL_TO = "contact@hasnainstudiox.com"
MAIL_FROM = "HSX Website <noreply@send.hasnainstudiox.com>"
LIST_FROM = "Hasnain Studio X <notes@send.hasnainstudiox.com>"

# RESEND_API_KEY is a secret, never a var:
#   npx wrangler secret put RESEND_API_KEY

# the release notes list. Created 2026-09-17.
[[d1_databases]]
binding = "LIST"
database_name = "hsx-list"
database_id = "0691f00a-50fb-4c80-b352-4c640d614068"
